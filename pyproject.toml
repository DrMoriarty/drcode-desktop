[project]
name = "drcode-desktop"
version = "0.1.0"
description = "DrCode Desktop: PySide6 GUI shell over the in-process drcode core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The core (git submodule ./drcode) is imported as an ordinary Python
    # library (drcode/src/drcode/...) via the path dependency below —
    # no IPC, no sidecar process.
    "drcode",
    # Essentials covers QtCore/QtGui/QtWidgets — everything the skeleton
    # needs; the full PySide6 pulls heavy unused add-on wheels. Capped at
    # 6.8: newer wheels are built for macOS 14.4+ and fail to dlopen on
    # older hosts.
    "PySide6-Essentials>=6.8,<6.9",
    # asyncio loop riding on the Qt event loop (single thread for Qt and
    # the pipeline — the exact threading model of the Textual app: worker
    # bodies, timers and UI callbacks all run on one loop thread).
    "qasync>=0.27",
]

[tool.uv.sources]
# The submodule is a full uv/hatchling project (dynamic version from its
# `version` file) — an editable path dependency makes `import drcode` work
# against ./drcode/src/drcode without copying anything.
drcode = { path = "drcode", editable = true }

[project.scripts]
drcode-desktop = "drcodedesktop.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-xdist>=3.8",
    "ruff>=0.17.1",
    "pyright[nodejs]>=1.1.414",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-n 4"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
# The drcode submodule is checked (and formatted) by its own tooling —
# this project's lint gate covers the shell only.
extend-exclude = ["drcode"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = [
    # The shell mirrors the core's own conventions (long docstrings etc.).
    "SIM108",
]
# The chat pane renders the TUI's glyphs verbatim (parity).
allowed-confusables = ["›", "—", "–", "─", "★", "▸", "▾", "⚙", "·"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["drcode", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# drcode itself is checked by its own pyright config in the submodule;
# extraPaths only resolves the `drcode.*` imports of the shell.
extraPaths = ["drcode/src"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drcodedesktop"]
